<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>수달공방 신청 현황</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/fonts/jua/jua.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--sky:#fbe9d6;--paper:#fff8ec;--wood:#8a5532;--wood-dark:#4b2b17;--ink:#3a2414;--ink-soft:#6f5440;--brick:#d0713a;--river:#4f8fb3;--line:#e5cfb1;--round:"Jua","Pretendard",sans-serif;--body:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{max-width:980px;margin:0 auto;padding:32px 16px 80px}
h1{font-family:var(--round);font-weight:400;font-size:32px;color:var(--wood-dark);margin:0 0 6px;display:flex;align-items:center;gap:12px}
h1 img{width:44px}
h2{font-family:var(--round);font-weight:400;font-size:24px;color:var(--wood-dark);margin:34px 0 12px}
.sub{color:var(--ink-soft);margin:0 0 26px}
.gate{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.gate input{flex:1;min-width:220px;font:inherit;padding:11px 14px;border-radius:10px;border:2px solid var(--line);background:#fff}
.btn{font-family:var(--round);font-size:16px;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--brick);color:#fff;box-shadow:0 4px 0 #9a4b20}
.btn.plain{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:active{transform:translateY(3px);box-shadow:none}
:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.msg{color:#b23c17;min-height:1.4em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-family:var(--round);font-weight:400;font-size:32px;color:var(--wood-dark)}
.kpi span{font-size:14px;color:var(--ink-soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.panel h3{font-size:16px;margin:0 0 4px}
.panel .meta{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.row{display:grid;grid-template-columns:minmax(120px,260px) 1fr 76px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.track{height:14px;background:#f2e3cc;border-radius:7px;overflow:hidden}
.track i{display:block;height:100%;background:var(--wood)}
.row.top .track i{background:var(--brick)}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-soft);font-size:13px}
.tablewrap{overflow-x:auto}
.comments{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.comments li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.comments time{display:block;font-size:12px;color:var(--ink-soft)}
.empty{color:var(--ink-soft);font-size:15px}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 64px}.row .track{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="/assets/icon.png" alt="">신청 현황</h1>
  <p class="sub">팀 전용 페이지예요. 열람 키를 넣으면 출시 알림 신청과 의견을 모아서 보여 줘요.</p>

  <form class="gate" id="gate">
    <label for="key" style="position:absolute;left:-9999px">열람 키</label>
    <input id="key" type="password" placeholder="열람 키" autocomplete="current-password">
    <button class="btn" type="submit">현황 보기</button>
  </form>
  <div class="msg" id="msg" role="alert"></div>
  <div id="out"></div>
</div>

<script src="/questions.js"></script>
<script>
(function(){
  var Q=window.SURVEY,out=document.getElementById('out'),msg=document.getElementById('msg'),keyIn=document.getElementById('key');
  var signups=[],feedback=[];
  try{var saved=sessionStorage.getItem('sudal_key');if(saved)keyIn.value=saved}catch(_){}
  var fromHash=new URLSearchParams(location.hash.slice(1)).get('key');if(fromHash)keyIn.value=fromHash;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pct(n,d){return d?Math.round(n/d*100):0}
  function when(s){return new Date(s).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}

  function load(){
    msg.textContent='불러오는 중…';
    fetch('/api/results?key='+encodeURIComponent(keyIn.value),{cache:'no-store'})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'불러오지 못했어요');return j})})
      .then(function(j){
        msg.textContent='';try{sessionStorage.setItem('sudal_key',keyIn.value)}catch(_){}
        // 같은 이메일로 여러 번 신청하면 가장 최근 것만 남김
        var seen={};signups=[];
        j.rows.filter(function(r){return r.kind==='signup'}).forEach(function(r){if(!seen[r.email]){seen[r.email]=1;signups.push(r)}});
        feedback=j.rows.filter(function(r){return r.kind!=='signup'});
        render();
      })
      .catch(function(e){msg.textContent=e.message;out.innerHTML=''});
  }
  document.getElementById('gate').addEventListener('submit',function(e){e.preventDefault();load()});
  if(keyIn.value)load();

  function bars(title,opts,counts,total,note){
    var max=Math.max.apply(null,opts.map(function(o){return counts[o]||0}));
    var h='<div class="panel"><h3>'+esc(title)+'</h3><div class="meta">'+total+'명'+(note?', '+note:'')+'</div>';
    opts.forEach(function(o){var c=counts[o]||0;h+='<div class="row'+(c&&c===max?' top':'')+'"><span>'+esc(o)+'</span><div class="track"><i style="width:'+pct(c,total)+'%"></i></div><span class="num">'+c+' ('+pct(c,total)+'%)</span></div>'});
    return h+'</div>';
  }

  function render(){
    var n=signups.length,win=0,mac=0,beta=0;
    signups.forEach(function(r){if((r.os||[]).indexOf('Windows')>-1)win++;if((r.os||[]).indexOf('macOS')>-1)mac++;if(r.beta)beta++});
    var intents=feedback.map(function(r){return r.answers&&r.answers.intent}).filter(Boolean);
    var avg=intents.length?(intents.reduce(function(a,b){return a+b},0)/intents.length).toFixed(1):'-';
    var h='<div class="kpis">'+
      '<div class="kpi"><b>'+n+'</b><span>출시 알림 신청</span></div>'+
      '<div class="kpi"><b>'+beta+'</b><span>테스트 참여 희망</span></div>'+
      '<div class="kpi"><b>'+win+' / '+mac+'</b><span>Windows / macOS</span></div>'+
      '<div class="kpi"><b>'+feedback.length+'</b><span>의견 응답</span></div>'+
      '<div class="kpi"><b>'+avg+'</b><span>사용 의향 평균 (5점)</span></div>'+
      '<div class="kpi"><b>'+pct(intents.filter(function(v){return v>=4}).length,intents.length)+'%</b><span>써볼래요 (4~5점)</span></div></div>';
    h+='<div class="actions"><button class="btn plain" id="csvS" type="button">신청자 CSV</button><button class="btn plain" id="csvF" type="button">의견 CSV</button><button class="btn plain" id="reload" type="button">새로고침</button></div>';

    h+='<h2>출시 알림 신청</h2>';
    if(!n)h+='<p class="empty">아직 신청이 없어요. 링크 뒤에 ?ref=insta 처럼 붙여서 공유하면 유입 경로도 같이 볼 수 있어요.</p>';
    else{
      var refs={};signups.forEach(function(r){var k=r.ref||'(직접 방문)';refs[k]=(refs[k]||0)+1});
      h+=bars('유입 경로',Object.keys(refs).sort(function(a,b){return refs[b]-refs[a]}),refs,n);
      h+='<div class="panel tablewrap"><table><thead><tr><th>신청 시각</th><th>이메일</th><th>OS</th><th>테스트</th><th>유입</th></tr></thead><tbody>'+
        signups.map(function(r){return '<tr><td>'+when(r.submittedAt)+'</td><td>'+esc(r.email)+'</td><td>'+esc((r.os||[]).join(', ')||'-')+'</td><td>'+(r.beta?'희망':'-')+'</td><td>'+esc(r.ref||'-')+'</td></tr>'}).join('')+
        '</tbody></table></div>';
    }

    h+='<h2>의견</h2>';
    if(!feedback.length)h+='<p class="empty">아직 의견이 없어요.</p>';
    else Q.forEach(function(q){
      if(q.type==='text'){
        var cs=feedback.filter(function(r){return r.answers&&r.answers[q.id]});
        h+='<div class="panel"><h3>'+esc(q.title)+'</h3><div class="meta">'+cs.length+'개</div><ul class="comments">'+
          (cs.length?cs.map(function(r){return '<li><time>'+when(r.submittedAt)+'</time>'+esc(r.answers[q.id])+'</li>'}).join(''):'<li>아직 없어요</li>')+'</ul></div>';
        return;
      }
      var opts=q.type==='scale'?['1','2','3','4','5']:q.options.slice(),counts={},total=0;
      feedback.forEach(function(r){var v=r.answers&&r.answers[q.id];if(v==null||v===''||(Array.isArray(v)&&!v.length))return;total++;(Array.isArray(v)?v:[String(v)]).forEach(function(x){if(opts.indexOf(x)<0)opts.push(x);counts[x]=(counts[x]||0)+1})});
      var labels=q.type==='scale'?opts.map(function(o){return o+'점'+(o==='1'?' ('+q.min+')':o==='5'?' ('+q.max+')':'')}):opts;
      var lc={};opts.forEach(function(o,i){lc[labels[i]]=counts[o]||0});
      h+=bars(q.title,labels,lc,total,q.type==='multi'?'복수 선택':'');
    });
    out.innerHTML=h;
    document.getElementById('reload').onclick=load;
    document.getElementById('csvS').onclick=function(){csv('signups',[['신청 시각','이메일','OS','테스트 희망','유입','신청 위치']].concat(signups.map(function(r){return [r.submittedAt,r.email,(r.os||[]).join(' | '),r.beta?'Y':'',r.ref||'',r.from||'']})))};
    document.getElementById('csvF').onclick=function(){csv('feedback',[['제출 시각'].concat(Q.map(function(q){return q.title}),['유입'])].concat(feedback.map(function(r){return [r.submittedAt].concat(Q.map(function(q){var v=r.answers&&r.answers[q.id];return Array.isArray(v)?v.join(' | '):(v==null?'':v)}),[r.ref||''])})))};
  }

  function csv(name,lines){
    var text='﻿'+lines.map(function(l){return l.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='sudal-'+name+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  }
})();
</script>
</body>
</html>
